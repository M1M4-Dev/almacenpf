<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacen DA+CO - Identificador de Códigos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="base/segmentos.css">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <header class="bg-gradient-to-r from-red-700 to-red-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="bg-white p-1.5 rounded-xl shadow-md flex items-center justify-center min-w-[70px] h-14">
                    <img src="BASE/001.png" alt="Logotipo DA+CO" class="max-h-11 w-auto object-contain" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'text-red-600 font-extrabold text-sm px-2\'>DA+CO</span>';">
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Almacen Punto Fijo</h1>
                    <p class="text-xs text-red-100/80 font-medium">Identificador de codigos</p>
                </div>
            </div>
            <div class="bg-red-800/40 backdrop-blur-sm border border-red-500/30 px-4 py-2 rounded-xl flex items-center space-x-2.5">
                <span id="statusBadge" class="h-2.5 w-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusText" class="text-xs font-semibold text-red-100 tracking-wide">Cargando recurso...</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 transition-all hover:shadow-md">
            <div class="relative max-w-2xl mx-auto text-center">
                <h3 class="text-lg font-bold text-slate-900 mb-2">Busqueda</h3>               
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="searchInput" disabled placeholder="Lectura de datos en progreso" 
                        class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl focus:outline-none focus:ring-4 focus:ring-red-500/10 focus:border-red-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed transition-all font-medium text-slate-900 placeholder-slate-400 shadow-inner" />
                </div>
            </div>
        </div>

        <div id="statusMessage" class="hidden flex items-center justify-between bg-white px-5 py-3 rounded-xl border border-slate-200/60 shadow-sm">
            <div class="flex items-center space-x-2 text-sm font-medium text-slate-600">
                <span>Coincidencias encontradas:</span>
                <span id="rowCount" class="font-bold text-red-600 bg-red-50 px-2.5 py-1 rounded-lg text-xs border border-red-100">0</span>
            </div>
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                Filtro en Tiempo Real
            </div>
        </div>

        <div id="dataContainer" class="w-full flex-grow flex flex-col justify-center">
            <div id="infoArea" class="flex flex-col items-center justify-center space-y-3 py-20 bg-white rounded-2xl border border-slate-200">
                <div class="h-8 w-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-medium text-slate-400">Estableciendo conexión interna con base/datos.csv...</p>
            </div>
            
            <div id="segmentsGrid" class="grid-segmentos hidden"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4.5 text-center text-xs font-semibold tracking-wide text-slate-400 uppercase">
        &copy; 2026 &middot; Eduardo Martinez "3DMM_58"
    </footer>

    <script>
        let databaseIndex = [];
        let csvColumns = [];
        const csvPath = 'base/datos.csv';

        document.addEventListener('DOMContentLoaded', () => {
            fetch(csvPath)
                .then(response => {
                    if (!response.ok) throw new Error(`No se localizó el archivo en "${csvPath}".`);
                    return response.text();
                })
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            if(results.data.length > 0) {
                                databaseIndex = results.data;
                                csvColumns = Object.keys(results.data[0]);
                                actualizarEstadoUI(true, "Base de datos actualizada");
                                activarBuscador();
                            } else {
                                actualizarEstadoUI(false, "El archivo CSV está vacío.");
                            }
                        },
                        error: function(error) {
                            actualizarEstadoUI(false, "Fallo al procesar CSV: " + error.message);
                        }
                    });
                })
                .catch(error => {
                    actualizarEstadoUI(false, error.message);
                });
        });

        function actualizarEstadoUI(exito, mensaje) {
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            
            badge.classList.remove('bg-amber-400', 'animate-pulse');
            if (exito) {
                badge.classList.add('bg-emerald-400');
                text.className = "text-xs font-bold text-emerald-100 tracking-wide";
                mostrarPantallaEspera(); // Cambia la pantalla de carga por la invitación a buscar
            } else {
                badge.classList.add('bg-rose-500');
                text.className = "text-xs font-bold text-rose-200 tracking-wide";
                
                document.getElementById('infoArea').innerHTML = `
                    <div class="inline-flex p-3 bg-rose-50 rounded-full text-rose-500 mb-3">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </div>
                    <p class="text-base font-bold text-slate-800">${mensaje}</p>
                    <p class="text-xs text-slate-400 mt-1 text-center px-4">Verifica que corras la app web mediante un servidor local.</p>`;
            }
            text.textContent = mensaje;
        }

        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        // Estado 1: Invitación inicial a buscar (Todo oculto por defecto)
        function mostrarPantallaEspera() {
            const infoArea = document.getElementById('infoArea');
            const grid = document.getElementById('segmentsGrid');
            const statusMessage = document.getElementById('statusMessage');

            grid.classList.add('hidden');
            statusMessage.classList.add('hidden'); // Oculta el contador superior
            
            infoArea.innerHTML = `
                <div class="inline-flex p-3 bg-red-50 rounded-full text-red-500 mb-2">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <p class="text-base font-bold text-slate-700">Sistema Listo</p>
                <p class="text-xs text-slate-400 max-w-xs text-center px-4">Escribe un S.K.U, modelo o palabra clave en el buscador superior para mostrar los datos de inventario.</p>`;
            infoArea.classList.remove('hidden');
        }

        function activarBuscador() {
            const searchInput = document.getElementById('searchInput');
            searchInput.disabled = false;
            searchInput.placeholder = "Busca palabras clave, modelo o S.K.U";
            searchInput.focus();
            
            searchInput.addEventListener('input', debounce(function() {
                const query = this.value.toLowerCase().trim();
                
                // Si borra el buscador, regresa a la pantalla de espera oculta datos
                if (!query) {
                    mostrarPantallaEspera();
                    return;
                }

                const resultadosFiltrados = databaseIndex.filter(registro => {
                    return csvColumns.some(columna => 
                        String(registro[columna]).toLowerCase().includes(query)
                    );
                });

                renderizarSegmentosOptimizados(resultadosFiltrados);
            }, 120));
        }

        // Estado 2 y 3: Renderizado dinámico bajo demanda
        function renderizarSegmentosOptimizados(datos) {
            const infoArea = document.getElementById('infoArea');
            const grid = document.getElementById('segmentsGrid');
            const statusMessage = document.getElementById('statusMessage');
            const rowCount = document.getElementById('rowCount');

            // Estado 2: Si no hay similitudes con lo que escribió
            if (datos.length === 0) {
                grid.classList.add('hidden');
                statusMessage.classList.add('hidden');
                infoArea.innerHTML = `
                    <svg class="w-10 h-10 mx-auto text-slate-300 mb-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span class="font-medium text-slate-400">No se encontraron segmentos coincidentes.</span>`;
                infoArea.classList.remove('hidden');
                return;
            }

            // Estado 3: Similitudes encontradas -> Mostrar bloques masivos
            infoArea.classList.add('hidden');
            statusMessage.classList.remove('hidden');
            rowCount.textContent = datos.length;

            const htmlChunks = datos.map(registro => {
                const filasHtml = csvColumns.map(columna => `
                    <div class="segmento-fila">
                        <span class="segmento-etiqueta">${columna}</span>
                        <span class="segmento-valor">${registro[columna] || '—'}</span>
                    </div>
                `).join('');
                
                return `<div class="tarjeta-segmento">${filasHtml}</div>`;
            }).join('');

            grid.innerHTML = htmlChunks;
            grid.classList.remove('hidden');
        }
    </script>
</body>
</html>
