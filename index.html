<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacen DA+CO</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-red-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div <img src="base/001.ico" alt="Logotipo de mi empresa" width="150"> <class="bg-white text-red-600 p-2 rounded-lg font-bold text-lg shadow-sm">DA+CO</div>
                <h1 class="text-xl font-extrabold tracking-tight">Buscador</h1>
            </div>
            <span class="text-xs bg-red-700 border border-red-400 px-3 py-1 rounded-full font-medium text-red-100">
                Carga Automática Activada
            </span>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        
        <div class="bg-white rounded-xl shadow-md border border-gray-100 p-6 mb-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="flex flex-col justify-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Verificacion de datos</span>
                <div class="flex items-center space-x-2">
                    <span id="statusBadge" class="h-3 w-3 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span id="statusText" class="text-sm font-medium text-gray-600">Conectando con base/datos.csv...</span>
                </div>
            </div>

            <div class="flex flex-col justify-center">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Busqueda</label>
                <input type="text" id="searchInput" disabled placeholder="Esperando que cargue la base de datos..." 
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 disabled:bg-gray-100 disabled:cursor-not-allowed transition-all shadow-inner" />
            </div>
        </div>

        <div id="statusMessage" class="text-sm text-gray-600 mb-4 hidden items-center justify-between bg-white p-3 rounded-lg border border-gray-100 shadow-sm">
            <div>Codigos encontrados: <span id="rowCount" class="font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded italic">0</span></div>
        </div>

        <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-left text-sm" id="resultsTable">
                    <thead class="bg-red-600 text-white">
                        <tr id="tableHeader">
                            <th class="px-6 py-4 text-center font-semibold tracking-wider">Cargando datos...</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-100" id="tableBody">
                        <tr>
                            <td class="px-6 py-12 text-center text-gray-400 italic">
                                Intentando leer el archivo remoto...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        &copy; Busqueda de datos - Eduardo Martinez, DA+CO 2026
    </footer>

    <script>
        let databaseIndex = [];
        const csvPath = 'base/datos.csv'; // <--- Define aquí la ruta y nombre de tu archivo

        // Carga automática al abrir la página
        document.addEventListener('DOMContentLoaded', () => {
            fetch(csvPath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`No se pudo encontrar el archivo "${csvPath}". Verifica que la carpeta y el archivo existan.`);
                    }
                    return response.text();
                })
                .then(csvText => {
                    // Procesar el texto del CSV con PapaParse
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            databaseIndex = results.data;
                            actualizarEstado(true, "Base de datos cargada con éxito");
                            activarBuscador();
                        },
                        error: function(error) {
                            actualizarEstado(false, "Error al procesar el archivo: " + error.message);
                        }
                    });
                })
                .catch(error => {
                    actualizarEstado(false, error.message);
                });
        });

        function actualizarEstado(exito, mensaje) {
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            
            badge.classList.remove('bg-yellow-500', 'animate-pulse');
            if (exito) {
                badge.classList.add('bg-green-500');
                text.className = "text-sm font-semibold text-green-600";
            } else {
                badge.classList.add('bg-red-500');
                text.className = "text-sm font-semibold text-red-600";
                
                // Mostrar error en la tabla también
                document.getElementById('tableHeader').innerHTML = `<th class="px-6 py-4 text-center">Error de Conexión</th>`;
                document.getElementById('tableBody').innerHTML = `<tr><td class="px-6 py-12 text-center text-red-500 font-medium">${mensaje}</td></tr>`;
            }
            text.textContent = mensaje;
        }

        function activarBuscador() {
            const searchInput = document.getElementById('searchInput');
            searchInput.disabled = false;
            searchInput.placeholder = "DESCRIPCION - S K U";
            searchInput.focus();
            
            renderizarTabla(databaseIndex);
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                
                if (!query) {
                    renderizarTabla(databaseIndex);
                    return;
                }

                const resultadosFiltrados = databaseIndex.filter(registro => {
                    return Object.values(registro).some(valor => 
                        String(valor).toLowerCase().includes(query)
                    );
                });

                renderizarTabla(resultadosFiltrados);
            });
        }

        function renderizarTabla(datos) {
            const headerRow = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            const statusMessage = document.getElementById('statusMessage');
            const rowCount = document.getElementById('rowCount');

            headerRow.innerHTML = "";
            tableBody.innerHTML = "";

            if (datos.length === 0) {
                headerRow.innerHTML = `<th class="px-6 py-4 text-center">Sin Coincidencias</th>`;
                tableBody.innerHTML = `<tr><td class="px-6 py-12 text-center text-gray-400">No hay registros que coincidan.</td></tr>`;
                statusMessage.classList.remove('hidden');
                rowCount.textContent = "0";
                return;
            }

            statusMessage.classList.remove('hidden');
            rowCount.textContent = datos.length;

            const columnas = Object.keys(datos[0]);
            columnas.forEach(columna => {
                const th = document.createElement('th');
                th.className = "px-6 py-4 font-bold uppercase tracking-wider text-xs border-b border-red-700";
                th.textContent = columna;
                headerRow.appendChild(th);
            });

            datos.forEach((registro, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-red-50/30 transition-colors' : 'bg-red-50/10 hover:bg-red-50/30 transition-colors';
                
                columnas.forEach(columna => {
                    const td = document.createElement('td');
                    td.className = "px-6 py-4 whitespace-nowrap text-gray-700 font-medium";
                    td.textContent = registro[columna] || '-';
                    tr.appendChild(td);
                });
                
                tableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
