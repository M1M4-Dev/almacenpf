<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacen DA+CO - Identificador de Códigos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Personalización de la barra de desplazamiento interna de la tabla */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #fca5a5; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <header class="bg-gradient-to-r from-red-700 to-red-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="bg-white p-1.5 rounded-xl shadow-md flex items-center justify-center min-w-[70px] h-14 bg-white">
                    <img src="BASE/001.png" alt="Logotipo DA+CO" class="max-h-11 w-auto object-contain" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'text-red-600 font-extrabold text-sm px-2\'>DA+CO</span>';">
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Almacen Punto Fijo</h1>
                    <p class="text-xs text-red-100/80 font-medium">Identificador de codigos</p>
                </div>
            </div>
            <div class="bg-red-800/40 backdrop-blur-sm border border-red-500/30 px-4 py-2 rounded-xl flex items-center space-x-2.5">
                <span id="statusBadge" class="h-2.5 w-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusText" class="text-xs font-semibold text-red-100 tracking-wide">Cargando recurso...</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 transition-all hover:shadow-md">
            <div class="relative max-w-2xl mx-auto text-center">
                <h3 class="text-lg font-bold text-slate-900 mb-2">Busqueda</h3>               
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="searchInput" disabled placeholder="Lectura de datos en progreso" 
                        class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl focus:outline-none focus:ring-4 focus:ring-red-500/10 focus:border-red-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed transition-all font-medium text-slate-900 placeholder-slate-400 shadow-inner" />
                </div>
            </div>
        </div>

        <div id="statusMessage" class="hidden animate-fadeIn flex items-center justify-between bg-white px-5 py-3 rounded-xl border border-slate-200/60 shadow-sm">
            <div class="flex items-center space-x-2 text-sm font-medium text-slate-600">
                <span>SKU disponibles:</span>
                <span id="rowCount" class="font-bold text-red-600 bg-red-50 px-2.5 py-1 rounded-lg text-xs border border-red-100">0</span>
            </div>
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                Indexación Activa
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-grow flex flex-col">
            <div class="overflow-x-auto w-full">
                <table class="min-w-full divide-y divide-slate-200 text-left text-sm" id="resultsTable">
                    <thead class="bg-gradient-to-b from-slate-900 to-slate-800 text-white">
                        <tr id="tableHeader">
                            <th class="px-6 py-4.5 text-center font-medium tracking-wider text-slate-300">Sincronizando el archivo...</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-slate-100 text-slate-700" id="tableBody">
                        <tr>
                            <td class="px-6 py-20 text-center">
                                <div class="flex flex-col items-center justify-center space-y-3">
                                    <div class="h-8 w-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
                                    <p class="text-sm font-medium text-slate-400">Estableciendo conexión interna con base/datos.csv...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4.5 text-center text-xs font-semibold tracking-wide text-slate-400 uppercase">
        &copy; 2026 &middot; Eduardo Martinez "3DMM_58"
    </footer>

    <script>
        let databaseIndex = [];
        const csvPath = 'base/datos.csv';

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                fetch(csvPath)
                    .then(response => {
                        if (!response.ok) throw new Error(`No se localizó el archivo en "${csvPath}".`);
                        return response.text();
                    })
                    .then(csvText => {
                        Papa.parse(csvText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: function(results) {
                                databaseIndex = results.data;
                                actualizarEstadoUI(true, "Base de datos actualizada");
                                activarBuscador();
                            },
                            error: function(error) {
                                actualizarEstadoUI(false, "Fallo al procesar CSV: " + error.message);
                            }
                        });
                    })
                    .catch(error => {
                        actualizarEstadoUI(false, error.message);
                    });
            }, 600);
        });

        function actualizarEstadoUI(exito, mensaje) {
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            
            badge.classList.remove('bg-amber-400', 'animate-pulse');
            if (exito) {
                badge.classList.add('bg-emerald-400');
                text.className = "text-xs font-bold text-emerald-100 tracking-wide";
            } else {
                badge.classList.add('bg-rose-500');
                text.className = "text-xs font-bold text-rose-200 tracking-wide";
                
                document.getElementById('tableHeader').innerHTML = `<th class="px-6 py-4.5 text-center text-rose-400 font-semibold bg-slate-900">Error de Origen de Datos</th>`;
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td class="px-6 py-16 text-center">
                            <div class="inline-flex p-3 bg-rose-50 rounded-full text-rose-500 mb-3">
                                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                            </div>
                            <p class="text-base font-bold text-slate-800">${mensaje}</p>
                            <p class="text-xs text-slate-400 mt-1">Asegúrate de que el archivo exista en la carpeta 'base' y de correr la web mediante un servidor local.</p>
                        </td>
                    </tr>`;
            }
            text.textContent = mensaje;
        }

        function activarBuscador() {
            const searchInput = document.getElementById('searchInput');
            searchInput.disabled = false;
            searchInput.placeholder = "Busca palabras clave, modelo o S.K.U";
            searchInput.focus();
            
            renderizarTablaPremium(databaseIndex);
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                
                if (!query) {
                    renderizarTablaPremium(databaseIndex);
                    return;
                }

                const resultadosFiltrados = databaseIndex.filter(registro => {
                    return Object.values(registro).some(valor => 
                        String(valor).toLowerCase().includes(query)
                    );
                });

                renderizarTablaPremium(resultadosFiltrados);
            });
        }

        function renderizarTablaPremium(datos) {
            const headerRow = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            const statusMessage = document.getElementById('statusMessage');
            const rowCount = document.getElementById('rowCount');

            headerRow.innerHTML = "";
            tableBody.innerHTML = "";

            if (datos.length === 0) {
                headerRow.innerHTML = `<th class="px-6 py-4.5 text-center text-slate-400 font-medium">Búsqueda sin resultados</th>`;
                tableBody.innerHTML = `
                    <tr>
                        <td class="px-6 py-16 text-center text-slate-400">
                            <svg class="w-10 h-10 mx-auto text-slate-300 mb-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span class="font-medium">No se encontraron registros.</span>
                        </td>
                    </tr>`;
                statusMessage.classList.remove('hidden');
                rowCount.textContent = "0";
                return;
            }

            statusMessage.classList.remove('hidden');
            rowCount.textContent = datos.length;

            const columnas = Object.keys(datos[0]);
            columnas.forEach(columna => {
                const th = document.createElement('th');
                th.className = "px-6 py-4.5 font-bold uppercase tracking-wider text-xs text-slate-200 border-b border-slate-700 select-none text-left";
                th.textContent = columna;
                headerRow.appendChild(th);
            });

            datos.forEach((registro, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 
                    ? 'bg-white hover:bg-red-50/40 transition-colors duration-150' 
                    : 'bg-slate-50/60 hover:bg-red-50/40 transition-colors duration-150';
                
                columnas.forEach(columna => {
                    const td = document.createElement('td');
                    td.className = "px-6 py-4.5 whitespace-nowrap text-slate-700 text-sm font-medium border-b border-slate-100";
                    td.textContent = registro[columna] || '—';
                    tr.appendChild(td);
                });
                
                tableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
